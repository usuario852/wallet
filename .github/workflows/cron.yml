# Avisos de Wallet cada 15 minutos (el plan Hobby de Vercel solo permite un cron diario).
# Necesita el secreto CRON_SECRET del repositorio con el mismo valor que en Vercel.
name: Avisos cada 15 minutos
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
jobs:
  cron:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Llamar a /api/cron
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "Falta el secreto CRON_SECRET"; exit 1; fi
          code=$(curl -s -o /tmp/out.txt -w '%{http_code}' -H "Authorization: Bearer $CRON_SECRET" https://wallet-one-rust.vercel.app/api/cron)
          cat /tmp/out.txt; echo; echo "HTTP $code"
          test "$code" -lt 400
